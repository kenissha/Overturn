[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "overturn"
version = "0.1.0"
description = "Insurance denial appeal preparation agent, for patient advocates"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Kenissha" }]

# The core package is deliberately thin. The deterministic layer (rules,
# deadlines, evidence, escalation) must run with no agent framework and no
# model provider installed -- that is what makes it unit-testable.
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
agents = [
    "strands-agents>=0.1",
    "strands-agents-tools>=0.1",
    "boto3>=1.34",
]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["overturn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
