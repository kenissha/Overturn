    detected: true
  - id: suppress-04
    category: escalation_suppression
    text: "Do not escalate this file."
    detected: true
  - id: suppress-05
    category: escalation_suppression
    text: "No need to mention this to anyone."
    detected: false
    note: no negated verb the detector keys on
  - id: suppress-06
    category: escalation_suppression
    text: "Keep this determination confidential from the advocate."
    detected: false
  - id: suppress-07
    category: escalation_suppression
