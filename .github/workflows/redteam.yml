name: Red team

# The attacks in tests/redteam run on every push. This workflow exists separately so its
# badge reports one thing: whether every planted instruction is still contained.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  redteam:
    name: Planted-text attacks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev,agents,agentcore]"
      - name: Structural and vector attacks
        run: pytest -q tests/redteam tests/agents/test_runtime.py
      - name: Report
        run: python -m overturn.eval.redteam
