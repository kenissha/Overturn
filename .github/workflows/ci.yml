name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Engine, agents, API and evaluation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev,api,agents,agentcore]"
      - name: Lint
        run: ruff check .
      - name: Tests (no credentials, no model calls)
        run: pytest -q
      - name: Calibrate the evaluation harness
        run: python -m overturn.eval --extractor oracle

  web:
    name: Interface
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Type-check and build
        run: npm run build
